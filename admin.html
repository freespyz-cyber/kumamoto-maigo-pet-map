<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理者画面｜熊本 迷子犬・迷子猫MAP</title>
  <style>
    body{margin:0;background:#f1f5f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
    main{max-width:760px;margin:24px auto;padding:20px}.box{background:#fff;border:1px solid #dbe4ee;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #1720330d}
    h1{font-size:24px;margin:0 0 8px}h2{font-size:19px}p{line-height:1.6;color:#475569}label{font-weight:800}input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
    button{border:0;border-radius:11px;padding:12px 15px;font-weight:900;font-size:15px;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#b91c1c;color:#fff}.muted{background:#e2e8f0;color:#334155}.post{border-top:1px solid #e2e8f0;padding:13px 0}.post:first-child{border-top:0}.post button{margin:6px 6px 0 0}.status{font-weight:900;color:#475569}.error{color:#b91c1c;font-weight:800}.ok{color:#166534;font-weight:800}
  </style>
</head>
<body><main>
  <section class="box"><h1>🔐 管理者画面</h1><p>投稿の確認・非公開・削除を行います。管理者パスワードは第三者に共有しないでください。</p>
    <label for="password">管理者パスワード</label><input id="password" type="password" autocomplete="current-password" placeholder="入力してください">
    <button class="primary" type="button" onclick="loadPosts()">投稿一覧を表示</button><span id="message"></span>
  </section>
  <section class="box"><h2>投稿データ</h2><div id="posts">パスワード入力後に表示します。</div></section>
  <section class="box"><h2>全投稿リセット</h2><p>すべての投稿を完全に削除します。この操作は元に戻せません。</p><button class="danger" type="button" onclick="resetAll()">全投稿を完全削除</button></section>
</main>
<script>
let password="";
function msg(t,cls=""){const e=document.getElementById("message");e.textContent=" "+t;e.className=cls}
async function call(body){const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"管理処理に失敗しました");return d}
async function loadPosts(){password=document.getElementById("password").value;if(!password){msg("パスワードを入力してください","error");return}try{const d=await call({action:"list"});document.getElementById("posts").innerHTML=d.posts?.length?d.posts.map(p=>`<div class="post"><div><b>#${p.id} ${p.animal||""}・${p.breed||""}</b></div><div>${p.status||""}／${p.place||""} <span class="status">${p.moderationState||"public"}</span></div><button class="danger" onclick="removePost(${p.id})">削除</button></div>`).join(""):"投稿はありません。";msg("一覧を読み込みました","ok")}catch(e){msg(e.message,"error")}}
async function removePost(id){if(!confirm(`投稿 #${id} を削除しますか？`))return;try{await call({action:"hide",id});await call({action:"delete",id});msg("削除しました","ok");loadPosts()}catch(e){msg(e.message+"（公開中の場合は、先に非公開にしてから再度削除してください）","error")}}
async function resetAll(){if(!password)password=document.getElementById("password").value;if(!password){msg("先にパスワードを入力してください","error");return}if(!confirm("全投稿を完全に削除します。よろしいですか？"))return;if(!confirm("元に戻せません。本当に全削除しますか？"))return;try{await call({action:"reset"});document.getElementById("posts").textContent="投稿はありません。";msg("全投稿を削除しました","ok")}catch(e){msg(e.message,"error")}}
</script></body></html>
